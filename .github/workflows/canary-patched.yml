name: Canary isolated migration verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate receipt contracts and execute isolated Canary 6 to 13 upgrade
        run: |
          set -euo pipefail
          node --test ops/canary-train/verify-migration-compatibility.test.mjs
          node ops/canary-train/verify-migration-compatibility.mjs "$RUNNER_TEMP/migration-preparation.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-preparation-proof-canary6-to-canary13
          path: ${{ runner.temp }}/migration-preparation.json
          retention-days: 1
          if-no-files-found: error
