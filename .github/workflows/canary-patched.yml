name: Canary isolated migration verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 12530487274
          github-token: ${{ github.token }}
          repository: copystring/paperclip
          run-id: 40020825993
          path: ${{ runner.temp }}/prepared-source
      - name: Verify and extract the immutable prepared Canary source
        env:
          EXPECTED_SOURCE_SHA256: 0c482dcad50cb30ed1d5995c4776a2c097cd51081c98c208cc1b56c60d6b5e36
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prepared-source/canary-source.tgz'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != os.environ['EXPECTED_SOURCE_SHA256']:
              raise SystemExit('Prepared source archive digest mismatch')
          PY
          tar -xzf "$RUNNER_TEMP/prepared-source/canary-source.tgz" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/paperclip-source/.canary-train.json"
          test -f "$RUNNER_TEMP/paperclip-output/provenance.json"
      - name: Apply the reviewed Source25 wake queue patch
        env:
          EXPECTED_PATCH_SHA256: e53c40be42fa38523343f89536c2e4acd4f9f3770c269d00b0d16b2a3c7caee1
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/ops/canary-train/diagnostic-source25-handoff.patch"
          echo "$EXPECTED_PATCH_SHA256  $patch" | sha256sum --check --status
          git -C "$RUNNER_TEMP/paperclip-source" apply --check "$patch"
          git -C "$RUNNER_TEMP/paperclip-source" apply "$patch"
          git -C "$RUNNER_TEMP/paperclip-source" status --short
      - name: Install and run focused wake queue PostgreSQL regressions
        working-directory: ${{ runner.temp }}/paperclip-source
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run preflight:workspace-links
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
          set -o pipefail
          pnpm --filter @paperclipai/server exec vitest run \
            src/modules/wake-queue/adapters/postgres.test.ts \
            src/modules/wake-queue/domain/policy.test.ts \
            src/__tests__/heartbeat-case-handoff.test.ts \
            src/__tests__/heartbeat-stale-queue-invalidation.test.ts \
            2>&1 | tee "$RUNNER_TEMP/source25-handoff-tests.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: source25-wake-queue-focused-test-log
          path: ${{ runner.temp }}/source25-handoff-tests.log
          retention-days: 7
          if-no-files-found: warn
