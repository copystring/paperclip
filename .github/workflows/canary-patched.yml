name: Canary focused PRP diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: canary-prepared-source
          run-id: 39883780190
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prepared
      - name: Restore exact failing source and add bounded timeout diagnostics
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/prepared/canary-source.tgz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/paperclip-source"
          git apply --check "$GITHUB_WORKSPACE/ops/canary-train/diagnostics/prp-timeout.patch"
          git apply "$GITHUB_WORKSPACE/ops/canary-train/diagnostics/prp-timeout.patch"
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = server/src/services/native-runtime/runner-tool-results-prp.integration.test.ts
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'paperclip-source'
          pkg = root / 'packages/paperclip-runner'
          store = subprocess.check_output(['pnpm','store','path','--silent'],cwd=root,text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('PNPM_STORE='+store+'\n')
              f.write('LOCK_HASH='+hashlib.sha256((root/'pnpm-lock.yaml').read_bytes()).hexdigest()+'\n')
              f.write('RUST_HASH='+hashlib.sha256((pkg/'runner/Cargo.lock').read_bytes()+b'\0'+(pkg/'rust-toolchain.toml').read_bytes()).hexdigest()+'\n')
          PY
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.PNPM_STORE }}
          key: canary-pnpm-${{ runner.os }}-${{ runner.arch }}-pnpm-9.15.4-${{ env.LOCK_HASH }}
      - name: Select exact source Rust toolchain
        working-directory: ${{ runner.temp }}/paperclip-source/packages/paperclip-runner
        run: |
          rustup show
          echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | awk '{print $1}')" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ${{ runner.temp }}/paperclip-source/packages/paperclip-runner/runner -> target
          shared-key: canary-runner-${{ env.RUST_HASH }}
          cache-workspace-crates: false
          cache-bin: false
          save-if: false
      - name: Install frozen dependencies and build the actual debug daemon
        working-directory: ${{ runner.temp }}/paperclip-source
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/paperclip-runner run build:rust
      - name: Run only the failing actual PRP boundary
        working-directory: ${{ runner.temp }}/paperclip-source
        run: |
          pnpm run preflight:workspace-links
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
          pnpm exec vitest run --project @paperclipai/server server/src/services/native-runtime/runner-tool-results-prp.integration.test.ts
