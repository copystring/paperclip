name: Canary isolated wire budget verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-wire-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 12537580084
          github-token: ${{ github.token }}
          repository: copystring/paperclip
          run-id: 40035689255
          path: ${{ runner.temp }}/prepared-source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 12537371025
          github-token: ${{ github.token }}
          repository: copystring/paperclip
          run-id: 40035689255
          path: ${{ runner.temp }}/native-artifact
      - name: Verify frozen source and exact-source Linux daemon
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess, json, shutil
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = temp / 'prepared-source/canary-source.tgz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '5e55c754a7810c7de6b3a221d5c6032e5a212ef6497468666d4e7d7b328e1aa9'
          subprocess.run(['tar', '-xzf', str(archive), '-C', str(temp)], check=True)
          source = temp / 'paperclip-source'
          expected = 'ade9fb1535b87b0d25b8b94221dd508c877c4e78'
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=source,text=True).strip() == expected
          provenance = json.loads((temp / 'paperclip-output/provenance.json').read_text())
          assert provenance['patchCommit'] == expected
          receipts = list((temp/'native-artifact').rglob('receipt.json'))
          assert len(receipts) == 1
          receipt = json.loads(receipts[0].read_text())
          binary = receipts[0].parent/'paperclip-runnerd'
          assert receipt['sourceRevision'] == expected and receipt['target'] == 'linux-x64'
          assert receipt['sha256'] == 'sha256:' + hashlib.sha256(binary.read_bytes()).hexdigest()
          assert receipt['schema'] == 'paperclip.runner.release-artifact.v1'
          binary.chmod(0o755)
          metadata=json.loads(subprocess.check_output([str(binary),'--build-metadata'],text=True))
          assert metadata == receipt['buildMetadata']
          dest=source/'packages/paperclip-runner/runner/target/debug/paperclip-runnerd'
          dest.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(binary,dest)
          dest.chmod(0o755)
          for name,digest in [('diagnostic-wire-fixture.patch','1adbca0ea7b0489f4b218b4f8fdca74675309dd92af5b148df4927fae1d27f8c'),('diagnostic-wire-fix.patch','78c322e0bf3f46e6c5a6498c73f6fb3dcbc585bf9a4ccfcb580fbb2906873589')]:
              patch=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'ops/canary-train'/name
              assert hashlib.sha256(patch.read_bytes()).hexdigest() == digest
          PY
          git -C "$RUNNER_TEMP/paperclip-source" apply --check "$GITHUB_WORKSPACE/ops/canary-train/diagnostic-wire-fixture.patch"
          git -C "$RUNNER_TEMP/paperclip-source" apply "$GITHUB_WORKSPACE/ops/canary-train/diagnostic-wire-fixture.patch"
      - name: Install exact dependencies and prepare test runtime
        working-directory: ${{ runner.temp }}/paperclip-source
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run preflight:workspace-links
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
          pnpm --filter @paperclipai/paperclip-runner build:typescript
      - name: Require regression failure before the production fix
        working-directory: ${{ runner.temp }}/paperclip-source
        env:
          PAPERCLIP_REQUIRE_RUNNER_API_INTEGRATION: '1'
        run: |
          set -uo pipefail
          pnpm --filter @paperclipai/server exec vitest run src/services/native-runtime/runner-tool-results-prp.integration.test.ts 2>&1 | tee "$RUNNER_TEMP/wire-before.log"
          status=${PIPESTATUS[0]}
          test "$status" -ne 0 || { echo 'Regression unexpectedly passed without the fix'; exit 1; }
          python3 - <<'PY'
          import os,pathlib
          log=(pathlib.Path(os.environ['RUNNER_TEMP'])/'wire-before.log').read_text()
          assert 'delivers escape-heavy 500 KB pages through actual PRP without truncation' in log
          assert '800082' in log and 'runnerd authenticated' in log, 'Failure did not prove the expected real PRP wire overflow'
          assert 'Escaped pages did not reach the provider' in log or 'PRP turn ended with status' in log or 'PRP emitted terminal' in log
          PY
      - name: Apply generic wire serialization fix and require focused green tests
        working-directory: ${{ runner.temp }}/paperclip-source
        env:
          PAPERCLIP_REQUIRE_RUNNER_API_INTEGRATION: '1'
        run: |
          set -euo pipefail
          git apply --check "$GITHUB_WORKSPACE/ops/canary-train/diagnostic-wire-fix.patch"
          git apply "$GITHUB_WORKSPACE/ops/canary-train/diagnostic-wire-fix.patch"
          pnpm --filter @paperclipai/server exec vitest run src/services/native-runtime/runner-tool-results.test.ts src/services/native-runtime/runner-tool-results.live.test.ts src/services/native-runtime/runner-tool-results-prp.integration.test.ts 2>&1 | tee "$RUNNER_TEMP/wire-after.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wire-budget-before-after-logs
          path: ${{ runner.temp }}/wire-*.log
          retention-days: 1
          if-no-files-found: warn
