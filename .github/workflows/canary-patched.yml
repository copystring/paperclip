name: Canary with maintained patches

on:
  pull_request:
    paths:
      - ops/canary-train/**
      - .github/workflows/canary-patched.yml
      - .github/workflows/pr.yml
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

jobs:
  controller-tests:
    if: github.repository == 'copystring/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s ops/canary-train -p 'test_*.py' -v
      - run: node --test .github/scripts/check-pr-test-coverage.test.mjs
  build:
    # Read-only controller PR tests must not wait behind a release build.
    # Only source assembly, publication and release generation share this lock.
    concurrency:
      group: canary-patched-release
      cancel-in-progress: false
    needs: controller-tests
    if: github.repository == 'copystring/paperclip' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout build controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Controller regression tests
        run: python3 -m unittest discover -s ops/canary-train -p 'test_*.py' -v
      - name: Assemble exact published Canary and pinned patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 ops/canary-train/build.py prepare
          --manifest "$GITHUB_WORKSPACE/ops/canary-train/patches.json"
          --workspace "$RUNNER_TEMP/paperclip-source"
          --output "$RUNNER_TEMP/paperclip-output"
      - name: Skip an already verified candidate
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/canary-train/publish.py --check --output "$RUNNER_TEMP/paperclip-output"
      - name: Verify candidate and build runtime packages
        if: steps.update.outputs.needed == 'true'
        run: >-
          python3 ops/canary-train/build.py build
          --workspace "$RUNNER_TEMP/paperclip-source"
          --output "$RUNNER_TEMP/paperclip-output"
      - name: Package verified runtime output
        if: steps.update.outputs.needed == 'true'
        run: >-
          python3 ops/canary-train/build.py package
          --workspace "$RUNNER_TEMP/paperclip-source"
          --output "$RUNNER_TEMP/paperclip-output"
      - name: Publish green candidate and maintained source branch
        if: steps.update.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/canary-train/publish.py --source "$RUNNER_TEMP/paperclip-source" --output "$RUNNER_TEMP/paperclip-output"
