name: Canary18 focused PRP diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose-prp-progress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 12542943474
          github-token: ${{ github.token }}
          repository: copystring/paperclip
          run-id: 40050215382
          path: ${{ runner.temp }}/prepared-source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 12543625101
          github-token: ${{ github.token }}
          repository: copystring/paperclip
          run-id: 40050215382
          path: ${{ runner.temp }}/native-artifact
      - name: Verify frozen Canary18 source and exact-source Linux daemon
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = temp / 'prepared-source/canary-source.tgz'
          expected_archive = 'd7780eca5874b30f144772f3c74c65480b238d14189a4a95bc6bcc322e0e9819'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected_archive
          subprocess.run(['tar', '-xzf', str(archive), '-C', str(temp)], check=True)
          source = temp / 'paperclip-source'
          expected_source = '9ccdaf7bb271d6f01639ff85fca3b5c106642d3d'
          expected_upstream = 'ec2e0d64079e6ba127401098eaadfd4ba6eb3074'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=source, text=True).strip() == expected_source
          provenance = json.loads((temp / 'paperclip-output/provenance.json').read_text())
          assert provenance['patchCommit'] == expected_source
          assert provenance['sourceCommit'] == expected_upstream
          receipts = list((temp / 'native-artifact').rglob('receipt.json'))
          assert len(receipts) == 1
          receipt_path = receipts[0]
          receipt = json.loads(receipt_path.read_text())
          binary = receipt_path.parent / 'paperclip-runnerd'
          assert receipt['sourceRevision'] == expected_source and receipt['target'] == 'linux-x64'
          assert receipt['sha256'] == 'sha256:' + hashlib.sha256(binary.read_bytes()).hexdigest()
          assert receipt['schema'] == 'paperclip.runner.release-artifact.v1'
          binary.chmod(0o755)
          metadata = json.loads(subprocess.check_output([str(binary), '--build-metadata'], text=True))
          assert metadata == receipt['buildMetadata']
          dest = source / 'packages/paperclip-runner/runner/target/debug/paperclip-runnerd'
          dest.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(binary, dest)
          dest.chmod(0o755)
          patch = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'ops/canary-train/diagnostic-prp-progress.patch'
          assert hashlib.sha256(patch.read_bytes()).hexdigest() == 'ad007c688103de63cfaaa9a35ea8ffaac678f09363aa2f3de5d90efc9800aeab'
          changed = subprocess.check_output(['git', 'diff', '--name-only', expected_source, '--'], cwd=source, text=True).splitlines()
          assert not changed, f'prepared source is not pristine: {changed}'
          PY
          git -C "$RUNNER_TEMP/paperclip-source" apply --check "$GITHUB_WORKSPACE/ops/canary-train/diagnostic-prp-progress.patch"
          git -C "$RUNNER_TEMP/paperclip-source" apply "$GITHUB_WORKSPACE/ops/canary-train/diagnostic-prp-progress.patch"
          python3 - <<'PY'
          import os, pathlib, subprocess
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'paperclip-source'
          changed = subprocess.check_output(['git', 'diff', '--name-only'], cwd=source, text=True).splitlines()
          assert changed == ['server/src/services/native-runtime/runner-tool-results-prp.integration.test.ts'], changed
          PY
      - name: Install frozen dependencies and prepare the test runtime
        working-directory: ${{ runner.temp }}/paperclip-source
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run preflight:workspace-links
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
          pnpm --filter @paperclipai/paperclip-runner build:typescript
      - name: Run only the PRP progress regression against the frozen Canary18 binary
        working-directory: ${{ runner.temp }}/paperclip-source
        env:
          PAPERCLIP_REQUIRE_RUNNER_API_INTEGRATION: '1'
        run: |
          set -euo pipefail
          pnpm --filter @paperclipai/server exec vitest run src/services/native-runtime/runner-tool-results-prp.integration.test.ts 2>&1 | tee "$RUNNER_TEMP/prp-diagnostic.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: canary18-prp-diagnostic-log
          path: ${{ runner.temp }}/prp-diagnostic.log
          retention-days: 1
          if-no-files-found: warn
