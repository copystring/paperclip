name: PR

on:
  pull_request:
    # Controller-only changes have their own Linux regression workflow.
    # The generated runtime is fully checked against its exact Canary source.
    paths-ignore:
      - ops/canary-train/**
      - .github/workflows/canary-patched.yml

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    # Master requires CODEOWNERS review for .github/**, including this workflow.
    # The AWS runner group permits pr-trusted.yml@refs/heads/master.
    uses: paperclipai/paperclip/.github/workflows/pr-trusted.yml@master
